name: Marketplace release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_app:
        description: 'Check GitHub App credentials and repository scope without creating PRs or publishing'
        default: false
        type: boolean
      release_pr:
        description: 'Merged release PR number for recovery; leave empty to maintain the release PR'
        required: false
        type: string
      dry_run:
        description: 'Validate and build without uploading or recording a version'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: plan
        name: Prove release PR or select controller mode
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
          RELEASE_PR: ${{ inputs.release_pr }}
          VERIFY_RELEASE_APP: ${{ inputs.verify_app }}
        run: node scripts/release.mjs plan

  app-check:
    if: needs.plan.outputs.mode == 'app-check'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: cixiangtao
          repositories: codex-project-chats
          permission-contents: read
      - name: Verify the scoped installation token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          EXPECTED_SLUG: ${{ vars.RELEASE_APP_SLUG }}
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.env.APP_SLUG, process.env.EXPECTED_SLUG);
          const scope = JSON.parse(execFileSync('gh', ['api', '/installation/repositories'], { encoding: 'utf8' }));
          assert.equal(scope.total_count, 1);
          assert.equal(scope.repositories[0].full_name, 'cixiangtao/codex-project-chats');
          console.log('Dedicated release App authenticated; token is scoped to the one intended repository.');
          JS

  controller:
    if: needs.plan.outputs.mode == 'controller'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Require the dedicated controller credential
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
        run: |
          test -n "$APP_CLIENT_ID" && test -n "$APP_PRIVATE_KEY" && test -n "$APP_SLUG" || {
            echo 'Configure the repository-scoped GitHub App described in docs/releasing.md.' >&2
            exit 1
          }
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: cixiangtao
          repositories: codex-project-chats
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Check controller identity
        env:
          ACTUAL_SLUG: ${{ steps.app.outputs.app-slug }}
          EXPECTED_SLUG: ${{ vars.RELEASE_APP_SLUG }}
        run: test "$ACTUAL_SLUG" = "$EXPECTED_SLUG"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  build:
    if: needs.plan.outputs.mode == 'release'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/release.mjs versions
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: npm audit --audit-level=high
      - run: npm run package
      - run: python3 scripts/verify-vsix.py
      - name: Record the inspected build identity
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_PR: ${{ needs.plan.outputs.pr }}
        run: |
          node scripts/release.mjs identity
          sha256sum *.vsix > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketplace-release-${{ needs.plan.outputs.version }}
          path: |
            *.vsix
            release-identity.json
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    if: needs.plan.outputs.mode == 'release' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: write
      issues: write
      pull-requests: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
      RELEASE_PR: ${{ needs.plan.outputs.pr }}
      RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the Marketplace federated identity
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" || {
            echo 'Marketplace federation is not configured. See docs/releasing.md.' >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marketplace-release-${{ needs.plan.outputs.version }}
          path: release-artifact
      - name: Check the immutable artifact
        run: |
          cd release-artifact
          sha256sum --check SHA256SUMS.txt
          node ../scripts/check-release-artifact.mjs
      - name: Reconcile an already published version
        id: existing
        shell: bash
        run: |
          set +e
          python3 scripts/marketplace.py "release-artifact/codex-project-chats-${RELEASE_VERSION}.vsix"
          result=$?
          set -e
          case "$result" in
            0) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            10) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) exit "$result" ;;
          esac
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.existing.outputs.exists != 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the inspected VSIX, then verify public availability
        shell: bash
        env:
          ALREADY_PUBLIC: ${{ steps.existing.outputs.exists }}
        run: |
          if [ "$ALREADY_PUBLIC" != true ]; then
            # A duplicate/pending upload can fail here. Only a matching public payload may reconcile it.
            node_modules/.bin/vsce publish --azure-credential --packagePath "release-artifact/codex-project-chats-${RELEASE_VERSION}.vsix" || echo 'Upload did not complete; checking for a matching public version.' >&2
          fi
          python3 scripts/marketplace.py "release-artifact/codex-project-chats-${RELEASE_VERSION}.vsix" --wait
      - name: Record the Marketplace version without a GitHub Release
        run: node scripts/release.mjs record

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}';">
  <link rel="stylesheet" href="{{STYLE}}">
  <title>Codex 项目对话</title>
</head>
<body>
  <header>
    <div class="scope" role="group" aria-label="对话范围">
      <button id="current" type="button" aria-pressed="true">当前项目</button>
      <button id="all" type="button" aria-pressed="false">全部项目</button>
    </div>
    <div class="search">
      <svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="4.3"/><path d="m10 10 3.5 3.5"/></svg>
      <input id="search" type="search" maxlength="200" placeholder="搜索对话标题" aria-label="搜索对话标题" autocomplete="off">
    </div>
    <div class="summary"><span id="summary" role="status" aria-live="polite">正在读取对话…</span><button id="refresh" class="icon" type="button" title="刷新对话" aria-label="刷新对话"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 5a5.4 5.4 0 1 0 .1 5M13 1.8V5H9.8"/></svg></button></div>
  </header>
  <main id="groups" aria-label="按项目分组的对话"></main>
  <section id="empty" hidden><p id="empty-title"></p><p id="empty-detail"></p><button id="empty-action" type="button" hidden>查看全部项目</button></section>
  <div id="error" role="alert" hidden><p id="error-text"></p><button id="retry" type="button">重新读取</button></div>
  <footer><button id="more" type="button" hidden>加载更多对话</button><span id="footer"></span></footer>
  <script nonce="{{NONCE}}" src="{{SCRIPT}}"></script>
</body>
</html>
